name: Publish Scheduled Posts

# Flips draft:true -> draft:false on content/blog/*.md posts once their
# publishedAt date arrives. Introduced 2026-07-28 alongside the approved
# Aug-Sep 2026 batch (13 posts, Tue/Fri cadence) so those posts stay
# hidden (existing `draft` filter in src/lib/blog/index.ts) until their
# scheduled date instead of going live immediately on commit.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  publish-scheduled-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Publish any scheduled posts due today
        run: node scripts/publish-scheduled-posts.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No scheduled posts to publish today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          git commit -m "chore: publish scheduled blog post(s)"
          git push
