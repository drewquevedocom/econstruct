name: Build & Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (fresh lockfile for Linux native deps)
        # --legacy-peer-deps: @opennextjs/cloudflare auto-bumps to versions
        # that require next>=16.2.5, but we pin next@16.2.4. The peer mismatch
        # is harmless at runtime; this flag stops npm from blocking the install.
        run: npm ci --legacy-peer-deps

      - name: Install lightningcss Linux native binary (Tailwind v4 requirement)
        # The lockfile bundles macOS/Windows binaries; install the Linux one
        # explicitly so Tailwind v4 can compile CSS in CI.
        run: npm install --no-save lightningcss-linux-x64-gnu

      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare build

      # Copy prerendered cache files into the static asset bundle so the
      # Worker can serve HTML directly via the ASSETS binding instead of
      # re-rendering every request (root cause of Cloudflare Error 1102).
      - name: Populate static-assets cache
        run: npx @opennextjs/cloudflare populateCache local --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
