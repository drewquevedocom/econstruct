name: Weekly Apollo Partner Refresh

on:
  schedule:
    # 6:00 AM Pacific on Mondays during PDT (13:00 UTC)
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  refresh-partners:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh partner inventory from Apollo
        shell: bash
        env:
          BASE_URL: ${{ secrets.ECONSTRUCT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${BASE_URL:-https://econstructhomes.com}"
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          auth_header=$(printf '%s%s%s' 'Authorization:' ' Bearer ' "$CRON_SECRET")

          post() {
            local path="$1"
            echo "==> POST ${path}"
            curl -fsS -X POST -H "$auth_header" "${BASE_URL}${path}"
            echo
          }

          post /api/agents/partner-refresh
          post /api/agents/partner-enroll
